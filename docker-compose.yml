version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tesis_db
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: tesis_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: tesis_web
    command: /app/entrypoint.sh 
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_volume: